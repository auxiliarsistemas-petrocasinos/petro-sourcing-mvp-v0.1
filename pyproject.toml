[project]
name = "chatbot-petro"
version = "0.1.0"
description = "Agente de investigación y recomendación de proveedores"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.1,<2",
    "openai>=1.100",
    "pydantic>=2.11,<3",
    "google-genai>=2.23.0",
    "tavily-python>=0.8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "httpx>=0.28,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
